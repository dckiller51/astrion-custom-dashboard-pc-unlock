; Astrion PC Unlock: an ESP32-S3 plugged into the PC as a USB keyboard, that types the Windows
; PIN when the Astrion remote asks (local network, with a code). See README.md.
;
; pioarduino: Arduino core 3.x for the ESP32-S3 (native USB, TinyUSB).

[platformio]
default_envs = atoms3u

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = arduino
; TinyUSB device (the keyboard) on the native USB port, no serial console on it: the boards'
; own USB mode flags are replaced.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; M5Stack AtomS3U: plugs straight into a USB-A port. RGB LED on GPIO35, button on GPIO41.
[env:atoms3u]
board = m5stack-atoms3
build_flags =
    ${env.build_flags}
    -DLED_PIN=35
    -DBUTTON_PIN=41

; Any ESP32-S3 board with a native USB port (ESP32-S3 SuperMini, DevKitC…): plug the port marked
; "USB" (not "UART"/"COM"). BOOT button (GPIO0) as the button, no LED.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DLED_PIN=-1
    -DBUTTON_PIN=0
